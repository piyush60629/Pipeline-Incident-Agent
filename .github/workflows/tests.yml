name: Tests

on:
  push:
    paths-ignore:
      - "eval/results/**"
      - "**.md"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests (offline, scripted model, no API key needed)
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m incident_agent.cli list
